  <!-- Orange Checkmark (tick) -->
  <polyline
    points="115,60 132,80 168,34"
    fill="none"
    stroke="#E8691A"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- SITIVE -->
  <text x="186" y="98"
    font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="100"
    fill="white"
    opacity="0.92"
    letter-spacing="-3">SITIVE</text>

  <!-- Left decorative line -->
  <line x1="10" y1="117" x2="105" y2="117"
    stroke="rgba(255,255,255,0.45)"
    stroke-width="1"/>

  <!-- ADMISSION GUIDANCE text -->
  <text x="270" y="122"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-weight="400"
    font-size="16"
